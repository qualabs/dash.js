<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Buffer target</title>

    <script src="../dist/dash.all.debug.js"></script>

    <!-- Bootstrap core CSS -->
    <link href="./lib/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="./lib/main.css" rel="stylesheet" />

    <style>
        video {
            width: 640px;
            height: 360px;
        }
    </style>
</head>

<body>
    <main>
        <div class="container py-4">
            <div class="col-md-8">
                <video controls="true"></video>
            </div>
        </div>
        <footer class="pt-3 mt-4 text-muted border-top">
            &copy; DASH-IF
        </footer>
        </div>
    </main>
    <style>
        .hide-controls::-webkit-media-controls {
            display: none !important;
        }

        .hide-controls::-moz-media-controls {
            display: none !important;
        }

        .hide-controls::-ms-media-controls {
            display: none !important;
        }
    </style>
    <script>
        var CMCD_DATA_GENERATED = dashjs.MetricsReporting.events.CMCD_DATA_GENERATED;
        var CMCD_MODE_QUERY = 'query';
        var CMCD_MODE_HEADER = 'header';

        document.addEventListener("DOMContentLoaded", function () {
            var video,
                player,
                url = "https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd"

            video = document.querySelector("video");
            player = dashjs.MediaPlayer().create();
            player.updateSettings({
                streaming: {
                    cmcd: {
                        enabled: true,
                        version: 2,
                        reporting: {
                            eventMode: {
                                enabled: true,
                                mode: CMCD_MODE_QUERY,
                                interval: 10000,
                                enabledKeys: ['sid', 'cid', 'pr', 'pt', 'ts'],
                                requestUrl: 'http://localhost:3000/cmcd/event-mode',
                                requestMethod: 'POST',
                            }
                        },
                        sid: 'leader-sid', /* session id to be given to the followers */
                        cid: 'client-cid',
                        mode: CMCD_MODE_QUERY,
                    }
                }
            });
            player.initialize(video, url, true);
        });
    </script>
</body>

</html>
